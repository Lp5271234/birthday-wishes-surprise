<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#3b184f">
  <meta name="description" content="一份专属于你的生日祝福，愿快乐、健康、好运和所有美好都在今天奔向你。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="生日快乐｜满满祝福正在奔向你">
  <meta property="og:description" content="点开这份小小惊喜，收下来自远方的生日祝福。">
  <meta property="og:url" content="https://lp5271234.github.io/birthday-wishes-surprise/">
  <meta property="og:image" content="https://lp5271234.github.io/birthday-wishes-surprise/assets/share-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>生日快乐｜满满祝福正在奔向你</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <div class="stars"></div>
    <div class="petals"></div>
  </div>

  <main>
    <section class="screen welcome is-active" id="welcome" aria-labelledby="welcomeTitle">
      <div class="welcome-inner">
        <div class="cake-wrap" aria-hidden="true">
          <div class="cake">
            <div class="candle"><i></i></div>
            <div class="cake-top"></div>
            <div class="cake-body">
              <span></span><span></span><span></span>
            </div>
            <div class="plate"></div>
          </div>
          <div class="cake-glow"></div>
        </div>
        <p class="eyebrow">今天，是专属于你的日子</p>
        <h1 id="welcomeTitle"><span id="welcomeName">亲爱的朋友</span><br><strong>生日快乐</strong></h1>
        <p class="welcome-copy">我准备了好多好多祝福<br>想一句一句，慢慢送给你</p>
        <button class="start-button" id="startButton" type="button">
          <span>点我收下祝福</span>
          <b>♡</b>
        </button>
        <p class="tap-tip">轻触按钮，开启这份小惊喜</p>
      </div>
    </section>

    <section class="screen celebration" id="celebration" aria-labelledby="celebrationTitle" aria-hidden="true">
      <header class="celebration-header">
        <div class="mini-cake" aria-hidden="true">🎂</div>
        <h2 id="celebrationTitle"><span id="celebrationName">亲爱的朋友</span>，生日快乐！</h2>
        <p>愿所有美好，都从今天开始奔向你</p>
      </header>

      <div class="wish-stage" id="wishStage">
        <div class="halo" aria-hidden="true"></div>
        <div class="wish-layer" id="wishLayer" aria-live="polite"></div>

        <article class="spotlight-card" id="spotlightCard">
          <div class="card-shine"></div>
          <p id="spotlightText">生日快乐</p>
          <span class="card-dots">♡ · ✦ · ♡</span>
        </article>

        <div class="balloon balloon-a" aria-hidden="true">🎈</div>
        <div class="balloon balloon-b" aria-hidden="true">🎈</div>
        <div class="balloon balloon-c" aria-hidden="true">🎈</div>
      </div>

      <footer class="celebration-footer">
        <div class="progress-wrap">
          <span id="progressText">祝福 1 / 1</span>
          <div class="progress-track"><i id="progressBar"></i></div>
        </div>
        <div class="footer-actions">
          <button id="soundButton" class="ghost-button" type="button">音乐开启</button>
          <button id="replayButton" class="ghost-button" type="button">再放一遍</button>
        </div>
        <p class="share-tip">这份祝福会一直循环，喜欢就分享给下一位寿星吧</p>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js" defer></script>
</body>
</html>
